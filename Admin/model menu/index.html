<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rust Endurance admin model management" />
    <title>Rust Endurance | Admin Model Menu</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="../entry%20point/" aria-label="Back to Admin menu">
          <svg class="brand-mark" viewBox="0 0 52 48" aria-hidden="true"><path d="M25 1 48 17 36 25 13 9 25 1Z"/><path d="M16 21 39 37 27 45 4 29 16 21Z"/></svg>
          <span>MARUTI SUZUKI</span>
        </a>
        <div class="account-area">
          <div class="powered-by"><span>Powered by</span><strong>DE</strong><span class="de-mark">››</span></div>
          <span class="divider" aria-hidden="true"></span>
          <div class="avatar" aria-hidden="true">SS</div>
          <button class="profile-button" id="profileButton" type="button" aria-expanded="false" aria-controls="profileMenu">
            <span class="profile-copy"><strong>Maruti ABC</strong><span>124</span></span>
            <span class="chevron" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="m5.5 7.5 4.5 4.5 4.5-4.5"/></svg></span>
          </button>
          <div class="profile-menu" id="profileMenu" role="menu" hidden>
            <div class="profile-menu__heading"><span class="mini-avatar">SS</span><span><strong>Maruti ABC</strong><small>Employee ID 124</small></span></div>
            <button type="button" role="menuitem">View profile</button>
            <button type="button" role="menuitem">Sign out</button>
          </div>
        </div>
      </header>

      <main class="page-panel">
        <div class="page-heading">
          <a class="back-link" href="../entry%20point/" aria-label="Back to Admin menu">←</a>
          <div><span>Model Management</span><h1>Admin Menu</h1></div>
        </div>

        <form class="filters" id="searchForm">
          <label>
            <span>Model</span>
            <div class="field-wrap">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11h18M7 7h10M8 15h8M10 19h4"/></svg>
              <input id="modelFilter" name="model" type="search" placeholder="Enter model name or code" autocomplete="off" />
            </div>
          </label>
          <label>
            <span>Chassis No.</span>
            <div class="field-wrap">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v10H4zM8 17v2M16 17v2M7 11h2M15 11h2"/></svg>
              <input id="chassisFilter" name="chassis" type="search" placeholder="Enter chassis number" autocomplete="off" />
            </div>
          </label>
          <button class="primary-button search-button" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
            Search
          </button>
          <button class="clear-button" id="clearFilters" type="button">Clear</button>
        </form>

        <section class="records" aria-labelledby="recordsTitle">
          <div class="records-toolbar">
            <div><h2 id="recordsTitle">Model records</h2><span id="recordCount">0 records</span></div>
            <a class="primary-button add-button" id="addModel" href="./model%20addition/"><span>＋</span> Add model</a>
          </div>

          <div class="table-frame">
            <table>
              <thead>
                <tr>
                  <th>Model Code</th><th>Trial</th><th>Chassis No.</th><th>Temp Symbol</th><th>Test Type</th><th>Test Phase Planned</th><th>Location</th><th>Remarks</th><th>Action</th>
                </tr>
              </thead>
              <tbody id="modelRows"></tbody>
            </table>
            <div class="empty-state" id="emptyState" hidden>
              <span>⌕</span><strong>No matching models</strong><p>Try changing the search filters or add a new record.</p>
            </div>
          </div>
        </section>

        <a class="secondary-button" href="../entry%20point/">← Go back</a>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
