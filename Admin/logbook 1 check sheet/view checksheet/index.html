<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="View a filled MIC or Admin checksheet" />
    <title>Rust Endurance | View Checksheet</title>
    <link rel="stylesheet" href="../../model%20menu/styles.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="../../entry%20point/" aria-label="Back to Admin menu"><span class="brand-logo-slot" aria-label="Logo placeholder"></span></a>
        <div class="account-area">
          <div class="avatar" aria-hidden="true">SS</div>
          <button class="profile-button" id="profileButton" type="button" aria-expanded="false" aria-controls="profileMenu">
            <span class="profile-copy"><strong>Maruti ABC</strong><span>124</span></span>
            <span class="chevron" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="m5.5 7.5 4.5 4.5 4.5-4.5"/></svg></span>
          </button>
          <div class="profile-menu" id="profileMenu" role="menu" hidden>
            <div class="profile-menu__heading"><span class="mini-avatar">SS</span><span><strong>Maruti ABC</strong><small>Admin User</small></span></div>
            <button type="button" role="menuitem">View profile</button><button type="button" role="menuitem" data-signout>Sign out</button>
          </div>
        </div>
      </header>

      <main class="page-panel viewer-panel">
        <div class="page-heading">
          <a class="back-link" href="../" aria-label="Back to raised forms">←</a>
          <div><span>Filled Form Review</span><h1>View Checksheet</h1></div>
        </div>
        <div class="viewer-layout">
          <aside class="form-rail" id="formRail" aria-label="Checksheets in this package"></aside>
          <section class="viewer-content">
            <div class="viewer-title">
              <div><span id="sourceBadge"></span><h2 id="formTitle"></h2></div>
              <span class="record-status" id="statusBadge"></span>
            </div>
            <div class="vehicle-details" id="vehicleDetails"></div>
            <div class="filled-table-frame" id="filledTable"></div>
            <div class="viewer-actions">
              <button class="primary-button" id="saveButton" type="button">Save</button>
              <button class="primary-button" id="submitButton" type="button">Submit</button>
              <a class="secondary-button" href="../">Go Back</a>
            </div>
          </section>
        </div>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
