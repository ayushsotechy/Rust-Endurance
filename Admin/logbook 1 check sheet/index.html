<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Admin view of MIC and Admin checksheet records" />
    <title>Rust Endurance | Admin Logbook Checksheet</title>
    <link rel="stylesheet" href="../model%20menu/styles.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="../entry%20point/" aria-label="Back to Admin menu">
          <span class="brand-logo-slot" aria-label="Logo placeholder"></span>
        </a>
        <div class="account-area">
          <div class="avatar" aria-hidden="true">SS</div>
          <button class="profile-button" id="profileButton" type="button" aria-expanded="false" aria-controls="profileMenu">
            <span class="profile-copy"><strong>Maruti ABC</strong><span>124</span></span>
            <span class="chevron" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="m5.5 7.5 4.5 4.5 4.5-4.5"/></svg></span>
          </button>
          <div class="profile-menu" id="profileMenu" role="menu" hidden>
            <div class="profile-menu__heading"><span class="mini-avatar">SS</span><span><strong>Maruti ABC</strong><small>Admin User</small></span></div>
            <button type="button" role="menuitem">View profile</button>
            <button type="button" role="menuitem" data-signout>Sign out</button>
          </div>
        </div>
      </header>

      <main class="page-panel logbook-panel">
        <div class="page-heading">
          <a class="back-link" href="../entry%20point/" aria-label="Back to Admin menu">←</a>
          <div><span>MIC &amp; Admin Forms</span><h1>Checksheet Approval Logbook</h1></div>
        </div>

        <form class="logbook-filters" id="searchForm">
          <label><span>From Date</span><input id="fromDate" type="date" /></label>
          <label><span>To Date</span><input id="toDate" type="date" /></label>
          <label><span>Model</span><input id="modelFilter" type="search" placeholder="Model code" /></label>
          <label><span>Chassis No.</span><input id="chassisFilter" type="search" placeholder="Chassis number" /></label>
          <label><span>Raised By</span>
            <select id="sourceFilter"><option value="">All</option><option>MIC</option><option>Admin</option></select>
          </label>
          <button class="primary-button search-button" type="submit">Search</button>
          <button class="clear-button" id="clearFilters" type="button">Clear</button>
        </form>

        <section class="records">
          <div class="records-toolbar">
            <div><h2>Checksheets available for review</h2><span id="recordCount">0 forms</span></div>
          </div>
          <div class="table-frame">
            <table class="logbook-table">
              <thead>
                <tr><th>Date</th><th>Checksheet Group</th><th>Model</th><th>Chassis No.</th><th>Trial</th><th>Test Type</th><th>Raised By</th><th>Status</th><th>Action</th></tr>
              </thead>
              <tbody id="logbookRows"></tbody>
            </table>
            <div class="empty-state" id="emptyState" hidden>
              <span>⌕</span><strong>No matching forms</strong><p>Change the filters to view more records.</p>
            </div>
          </div>
        </section>

        <div class="footer-actions">
          <a class="secondary-button" href="../entry%20point/">Go Back</a>
          <button class="primary-button" id="exportAll" type="button">Export All</button>
        </div>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
