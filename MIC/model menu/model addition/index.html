<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rust Endurance model addition" />
    <title>Rust Endurance | Model Addition</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="../../entry%20point/" aria-label="Back to MIC menu">
          <svg class="brand-mark" viewBox="0 0 52 48" aria-hidden="true">
            <path d="M25 1 48 17 36 25 13 9 25 1Z" />
            <path d="M16 21 39 37 27 45 4 29 16 21Z" />
          </svg>
          <span>MARUTI SUZUKI</span>
        </a>

        <div class="account-area">
          <div class="powered-by" aria-label="Powered by DE">
            <span>Powered by</span>
            <strong>DE</strong>
            <span class="de-mark" aria-hidden="true">››</span>
          </div>
          <span class="divider" aria-hidden="true"></span>
          <div class="avatar" aria-hidden="true">SS</div>
          <button class="profile-button" id="profileButton" type="button" aria-expanded="false" aria-controls="profileMenu">
            <span class="profile-copy">
              <strong>Maruti ABC</strong>
              <span>124</span>
            </span>
            <span class="chevron" aria-hidden="true">
              <svg viewBox="0 0 20 20"><path d="m5.5 7.5 4.5 4.5 4.5-4.5" /></svg>
            </span>
          </button>

          <div class="profile-menu" id="profileMenu" role="menu" hidden>
            <div class="profile-menu__heading">
              <span class="mini-avatar">SS</span>
              <span><strong>Maruti ABC</strong><small>Employee ID 124</small></span>
            </div>
            <button type="button" role="menuitem">View profile</button>
            <button type="button" role="menuitem" data-signout>Sign out</button>
          </div>
        </div>
      </header>

      <main class="page-panel">
        <section class="page-heading" aria-labelledby="pageTitle">
          <div>
            <span>Logbook Management</span>
            <h1 id="pageTitle">Model Addition</h1>
          </div>
        </section>

        <div class="addition-layout">
          <aside class="step-rail" aria-label="Check sheet sections" id="sectionTabs">
            <button class="step-item active" type="button" data-section="work_start_up_inspection">Work Start up Inspection</button>
            <button class="step-item" type="button" data-section="first_phase_observation_sheet">1st phase observation sheet</button>
            <button class="step-item" type="button" data-section="operation_durability_cycles">Operation Durability Cycles</button>
            <button class="step-item" type="button" data-section="corrosion_coupon_measurement">Corrosion Coupon data measurement</button>
            <button class="step-item" type="button" data-section="scribe_line_measurement">Scribe line measurement</button>
            <button class="step-item" type="button" data-section="crs_check_sheet">CRS check sheet</button>
            <button class="step-item" type="button" data-section="dismantling_inspection">Dismantling inspection sheet filled</button>
            <button class="step-item" type="button" data-section="photo_annexure">Photo Annexure</button>
          </aside>

          <section class="addition-content" aria-label="Model addition form">
            <div class="section-banner">
              <span>MIC Checksheet Builder</span>
              <h2 id="sectionTitle">Work Start up Inspection</h2>
            </div>
            <div id="sectionBody"></div>
          </section>
        </div>

        <a class="secondary-button" href="../">Go Back</a>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
