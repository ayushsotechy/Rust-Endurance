<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rust Endurance plan setup" />
    <title>Rust Endurance | Plan</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="../../../entry%20point/" aria-label="Back to MIC menu">
          <svg class="brand-mark" viewBox="0 0 52 48" aria-hidden="true">
            <path d="M25 1 48 17 36 25 13 9 25 1Z" />
            <path d="M16 21 39 37 27 45 4 29 16 21Z" />
          </svg>
          <span>MARUTI SUZUKI</span>
        </a>

        <div class="account-area">
          <div class="powered-by" aria-label="Powered by DE">
            <span>Powered by</span>
            <strong>DE</strong>
            <span class="de-mark" aria-hidden="true">››</span>
          </div>
          <span class="divider" aria-hidden="true"></span>
          <div class="avatar" aria-hidden="true">SS</div>
          <button class="profile-button" id="profileButton" type="button" aria-expanded="false" aria-controls="profileMenu">
            <span class="profile-copy">
              <strong>Maruti ABC</strong>
              <span>124</span>
            </span>
            <span class="chevron" aria-hidden="true">
              <svg viewBox="0 0 20 20"><path d="m5.5 7.5 4.5 4.5 4.5-4.5" /></svg>
            </span>
          </button>

          <div class="profile-menu" id="profileMenu" role="menu" hidden>
            <div class="profile-menu__heading">
              <span class="mini-avatar">SS</span>
              <span><strong>Maruti ABC</strong><small>Employee ID 124</small></span>
            </div>
            <button type="button" role="menuitem">View profile</button>
            <button type="button" role="menuitem" data-signout>Sign out</button>
          </div>
        </div>
      </header>

      <main class="page-panel">
        <section class="page-heading">
          <div>
            <span>Plan management</span>
            <h1 id="planTitle">Plan</h1>
          </div>
        </section>

        <div class="plan-content">
          <form class="plan-form" id="planForm">
            <label>
              <span>Start Date:</span>
              <div class="field-wrap">
                <input type="date" name="startDate" />
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="16" rx="3" />
                  <path d="M8 3v4M16 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01" />
                </svg>
              </div>
            </label>

            <label>
              <span>Daily Target</span>
              <input type="text" name="dailyTarget" placeholder="" />
            </label>

            <label>
              <span>End Date:</span>
              <div class="field-wrap">
                <input type="date" name="endDate" />
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="16" rx="3" />
                  <path d="M8 3v4M16 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01" />
                </svg>
              </div>
            </label>
          </form>

          <div class="table-frame">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Day</th>
                  <th>Target</th>
                </tr>
              </thead>
              <tbody>
                <tr><td>Dummy</td><td>Dummy</td><td>Dummy</td></tr>
                <tr><td>Dummy</td><td>Dummy</td><td>Dummy</td></tr>
                <tr><td>Dummy</td><td>Dummy</td><td>Dummy</td></tr>
              </tbody>
            </table>
          </div>

          <div class="plan-actions">
            <button class="secondary-button add-button" id="addRow" type="button">Add <span>＋</span></button>
            <button class="primary-button submit-button" type="button" id="submitPlan">Submit</button>
          </div>
        </div>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
